<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#ffffff"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#252525"
    />

    <title>Poruya — Practise real board questions</title>
    <meta
      name="description"
      content="A Bangladeshi board and admission question bank organised by subject, chapter and topic, with timed MCQ mock exams that target your weak topics. Free during early access."
    />
    <link rel="canonical" href="https://poruya.com/" />

    <!--
      This is a client-rendered SPA, so these tags are static and identical for
      every route. Social crawlers don't run JS, so per-route previews would
      need prerendering or react-helmet-async.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Poruya" />
    <meta property="og:title" content="Poruya — Practise real board questions" />
    <meta
      property="og:description"
      content="Past board and admission questions organised by subject, chapter and topic, plus timed MCQ mock exams that target your weak topics."
    />
    <meta property="og:url" content="https://poruya.com/" />

    <!--
      No og:image yet. vercel.json rewrites everything to index.html, so
      pointing at a file that doesn't exist would serve HTML with a 200 status
      and render a broken preview card. Once a 1200x630 client/public/og.png
      exists, add:
        meta property="og:image" content="https://poruya.com/og.png"
        meta property="og:image:alt" content="Poruya"
      and switch twitter:card below to summary_large_image.
    -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Poruya — Practise real board questions"
    />
    <meta
      name="twitter:description"
      content="Past board and admission questions organised by subject, chapter and topic, plus timed MCQ mock exams that target your weak topics."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
